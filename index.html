        <h1>薄荷起始页 - 简洁可定制的新标签页</h1>
        <p>薄荷起始页（MintStart）是一款开源的浏览器新标签页与起始页工具。每次打开新标签页，页面会自动加载当天的 Bing 每日壁纸，并将常用网站快捷方式、搜索框和多设备同步整合在一个干净清爽的入口中。</p>
        <h2>薄荷起始页的主要功能</h2>
        <ul>
          <li>Bing 每日壁纸：打开新标签页即自动展示当天 Bing 高清壁纸，界面清爽不杂乱。</li>
          <li>网站快捷方式：常用网站一键直达，支持拖拽排序和文件夹分组整理。</li>
          <li>多搜索引擎：内置 Bing、百度、Google、搜狗搜索，可随时切换偏好。</li>
          <li>云端同步：登录账户后，快捷方式和设置自动同步到其他设备。</li>
        </ul>
        <p>如果你希望浏览器起始页更简洁、更高效，薄荷起始页是一个不错的替代方案。请启用 JavaScript 以使用完整功能。</p>
      </main>
